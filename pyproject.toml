[project]
name = "titikapi"
version = "0.1.0"
description = "7-day wildfire risk forecasts for Sumatra & Kalimantan, Indonesia"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "rioxarray>=0.23.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "torch>=2.14,<2.15",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "xclim>=1.0.0",
    "zarr>=3.4.2",
]

[project.scripts]
titikapi = "titikapi.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# PyTorch: CUDA build on the Windows dev machine (RTX 3050), CPU build elsewhere (GitHub Actions).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
